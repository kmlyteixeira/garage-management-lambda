name: Lambda Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment
        required: true
        default: homologacao
        type: choice
        options: [homologacao, producao]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: dotnet tool install -g Amazon.Lambda.Tools
      - run: dotnet lambda deploy-function ${{ vars.LAMBDA_FUNCTION_NAME }} --project-location src/GarageManagement.AuthLambda --region ${{ vars.AWS_REGION }} --function-role ${{ secrets.LAMBDA_EXECUTION_ROLE_ARN }}
